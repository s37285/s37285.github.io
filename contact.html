<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Trebuchet MS","Tahoma",sans-serif;
    color:#000000;
    min-height:100vh;

    background:
    radial-gradient(circle at 10% 20%,#FFF8DC,transparent 30%),
    radial-gradient(circle at 90% 80%,#DCDCDC,transparent 35%),
    linear-gradient(135deg,#DCDCDC,#FFF8DC);
}


/* MENU */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;

    padding:16px 20px;

    background:rgba(255,248,220,0.96);

    border-bottom:3px solid #FFD700;

    box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

.menu{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.menu a{
    position:relative;

    color:#000000;
    text-decoration:none;

    font-size:16px;
    font-weight:bold;

    padding:12px 20px;

    transition:0.3s;
}

.menu a::before{
    content:"☁️";

    position:absolute;

    left:-8px;
    top:-6px;

    font-size:24px;
}

.menu a::after{
    content:"☁️";

    position:absolute;

    right:-8px;
    bottom:-7px;

    font-size:24px;
}

.menu a:hover{
    color:#6495ED;

    transform:translateY(-4px);
}


/* FLOAT */

.sun{
    position:fixed;

    font-size:55px;

    animation:sun 6s ease-in-out infinite;
}

.sun1{
    top:120px;
    left:5%;
}

.sun2{
    bottom:10%;
    right:7%;
    animation-delay:2s;
}

.cloud{
    position:fixed;

    font-size:60px;

    animation:cloud 8s ease-in-out infinite;
}

.cloud1{
    top:28%;
    right:5%;
}

.cloud2{
    bottom:18%;
    left:6%;
    animation-delay:2s;
}

.cloud3{
    top:55%;
    right:15%;

    font-size:45px;

    animation-delay:4s;
}

@keyframes sun{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-25px);
    }

}

@keyframes cloud{

    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(30px) translateY(-15px);
    }

}


/* PAGE */

.page{
    min-height:100vh;

    padding:150px 25px 70px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    position:relative;
    z-index:2;
}


/* TITLE */

.page-title{
    font-size:clamp(45px,7vw,80px);

    text-align:center;

    margin-bottom:40px;
}

.page-title::after{
    content:"";

    display:block;

    width:120px;
    height:6px;

    background:#FFD700;

    border-radius:20px;

    margin:18px auto;
}


/* CONTACT BOX */

.contact-box{
    width:min(800px,95%);

    background:rgba(255,255,255,0.84);

    border:3px solid #6495ED;

    border-radius:35px;

    padding:40px;

    box-shadow:
    0 18px 40px rgba(0,0,0,0.15);

    position:relative;
}

.contact-box::before{
    content:"";

    position:absolute;

    inset:10px;

    border:2px solid rgba(255,215,0,0.6);

    border-radius:25px;

    pointer-events:none;
}


/* CONTACT ITEM */

.contact{
    position:relative;

    display:flex;

    align-items:center;

    gap:20px;

    background:rgba(255,248,220,0.85);

    border:2px solid #6495ED;

    border-radius:20px;

    padding:22px;

    margin:18px 0;

    font-size:20px;

    transition:0.3s;
}

.contact:hover{
    transform:translateX(7px);

    box-shadow:
    0 10px 20px rgba(0,0,0,0.12);
}

.icon{
    font-size:35px;

    width:50px;

    text-align:center;
}

.contact a{
    color:#000000;

    text-decoration:none;

    word-break:break-word;
}

.contact a:hover{
    color:#6495ED;

    text-decoration:underline;
}


@media(max-width:700px){

    .menu{
        gap:3px;
    }

    .menu a{
        font-size:11px;
        padding:8px 12px;
    }

    .page{
        padding-top:145px;
    }

    .contact-box{
        padding:28px 18px;
    }

    .contact{
        font-size:16px;

        padding:18px;

        gap:12px;
    }

    .icon{
        font-size:28px;
        width:40px;
    }

}

</style>
