<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ช่องทางการติดต่อ | Portfolio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:"Trebuchet MS","Tahoma",sans-serif;
    color:#000000;
    min-height:100vh;
    overflow-x:hidden;

    background:
    radial-gradient(circle at 10% 20%,#FFF8DC,transparent 30%),
    radial-gradient(circle at 90% 80%,#DCDCDC,transparent 35%),
    linear-gradient(135deg,#DCDCDC,#FFF8DC);
}


/* =========================
   MENU
========================= */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;

    padding:14px 20px;

    background:rgba(255,248,220,0.96);

    border-bottom:3px solid #FFD700;

    box-shadow:
    0 5px 20px rgba(0,0,0,0.15);
}

.menu{
    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    gap:12px;
}


/* ปุ่มเมนู */

.menu a{

    color:#000000;

    font-family:"Trebuchet MS","Tahoma",sans-serif;

    font-weight:bold;

    font-size:16px;

    padding:11px 20px;

    background:#FFFDF2;

    border:2px solid #FFD700;

    border-radius:18px;

    cursor:pointer;

    box-shadow:
    0 5px 12px rgba(0,0,0,0.12);

    transition:0.3s ease;

    text-decoration:none;

    display:inline-block;
}

.menu a:hover{

    background:#FFD700;

    transform:translateY(-4px);

    box-shadow:
    0 9px 18px rgba(0,0,0,0.20);
}


/* หน้าที่กำลังเปิด */

.menu a.active{

    background:#FFD700;

    color:#000000;

    box-shadow:
    0 7px 16px rgba(0,0,0,0.20);
}


/* =========================
   FLOAT
========================= */

.sun{

    position:fixed;

    font-size:55px;

    pointer-events:none;

    z-index:1;

    animation:
    float 6s ease-in-out infinite;
}

.sun1{
    top:120px;
    left:6%;
}

.sun2{
    bottom:10%;
    right:7%;
    animation-delay:2s;
}

.cloud{

    position:fixed;

    font-size:60px;

    pointer-events:none;

    z-index:1;

    animation:
    cloud 8s ease-in-out infinite;
}

.cloud1{
    top:30%;
    right:6%;
}

.cloud2{
    bottom:18%;
    left:6%;
    animation-delay:2s;
}

.cloud3{
    top:55%;
    right:15%;
    font-size:45px;
    animation-delay:4s;
}

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-25px);
    }

}

@keyframes cloud{

    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:
        translateX(30px)
        translateY(-15px);
    }

}


/* =========================
   PAGE
========================= */

.page{

    min-height:100vh;

    padding:
    150px 25px 70px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    position:relative;

    z-index:2;
}


/* =========================
   TITLE
========================= */

.page-title{

    font-size:
    clamp(45px,7vw,80px);

    text-align:center;

    margin-bottom:20px;
}

.page-title::after{

    content:"";

    display:block;

    width:120px;

    height:6px;

    background:#FFD700;

    border-radius:20px;

    margin:18px auto;
}


/* =========================
   รูปใต้หัวข้อ
========================= */

.contact-image{

    width:300px;

    height:200px;

    object-fit:cover;

    border:5px solid #FFD700;

    border-radius:25px;

    padding:5px;

    background:#FFF8DC;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.18);

    margin-bottom:35px;

    transition:0.3s ease;
}

.contact-image:hover{

    transform:
    translateY(-5px)
    scale(1.02);

    box-shadow:
    0 15px 30px rgba(0,0,0,0.22);
}


/* =========================
   CONTACT BOX
========================= */

.contact-box{

    width:min(800px,95%);

    background:
    rgba(255,255,255,0.84);

    border:3px solid #6495ED;

    border-radius:35px;

    padding:40px;

    box-shadow:
    0 18px 40px rgba(0,0,0,0.15);

    position:relative;
}

.contact-box::before{

    content:"";

    position:absolute;

    inset:10px;

    border:
    2px solid
    rgba(255,215,0,0.6);

    border-radius:25px;

    pointer-events:none;
}


/* =========================
   CONTACT ITEM
========================= */

.contact{

    position:relative;

    display:flex;

    align-items:center;

    gap:20px;

    background:
    rgba(255,248,220,0.85);

    border:2px solid #6495ED;

    border-radius:20px;

    padding:22px;

    margin:18px 0;

    font-size:20px;

    transition:0.3s;
}

.contact:hover{

    transform:
    translateX(7px);

    box-shadow:
    0 10px 20px rgba(0,0,0,0.12);
}

.icon{

    font-size:35px;

    width:50px;

    text-align:center;
}


/* =========================
   ลิงก์ที่กดได้
========================= */

.contact a{

    color:#000000;

    text-decoration:none;

    word-break:break-word;
}

.contact a:hover{

    color:#6495ED;

    text-decoration:underline;
}


/* =========================
   FACEBOOK / TIKTOK
   ไม่เป็นปุ่มกด
========================= */

.social-text{

    color:#000000;

    text-decoration:none;

    cursor:default;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    nav{

        padding:
        10px 8px;
    }

    .menu{

        gap:6px;
    }

    .menu a{

        font-size:11px;

        padding:
        8px 11px;

        border-radius:13px;
    }

    .page{

        padding:
        145px 15px 50px;
    }

    .page-title{

        font-size:42px;
    }

    .contact-image{

        width:90%;

        max-width:300px;

        height:auto;

        aspect-ratio:3/2;

        margin-bottom:30px;
    }

    .contact-box{

        padding:
        28px 18px;
    }

    .contact{

        font-size:16px;

        padding:18px;

        gap:12px;
    }

    .icon{

        font-size:28px;

        width:40px;
    }

}

</style>
